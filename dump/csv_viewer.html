        /**
         * Robust CSV Parsing Function
         * Supports quoted strings, nested commas, line breaks in quotes, escaped quotes ("")
         */
        function parseCSV(text, delimiter = 'auto') {
            if (!text) return { headers: [], data: [] };

            // Delimiter Auto-Detection if set to auto
            if (delimiter === 'auto') {
                const firstLine = text.split(/\r\n|\n/)[0] || '';
                const commaCount = (firstLine.match(/,/g) || []).length;
                const tabCount = (firstLine.match(/\t/g) || []).length;
                const semiCount = (firstLine.match(/;/g) || []).length;

                if (tabCount > commaCount && tabCount > semiCount) delimiter = '\t';
                else if (semiCount > commaCount && semiCount > tabCount) delimiter = ';';
                else delimiter = ',';
            }

            const rows = [];
            let currentRow = [];
            let currentToken = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (inQuotes) {
                    if (char === '"') {
                        if (nextChar === '"') {
                            currentToken += '"';
                            i++; // Skip next quote
                        } else {
                            inQuotes = false;
                        }
                    } else {
                        currentToken += char;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                    } else if (char === delimiter) {
                        currentRow.push(currentToken.trim());
                        currentToken = '';
                    } else if (char === '\r') {
                        if (nextChar === '\n') {
                            i++;
                        }
                        currentRow.push(currentToken.trim());
                        rows.push(currentRow);
                        currentRow = [];
                        currentToken = '';
                    } else if (char === '\n') {
                        currentRow.push(currentToken.trim());
                        rows.push(currentRow);
                        currentRow = [];
                        currentToken = '';
                    } else {
                        currentToken += char;
                    }
                }
            }

            if (currentToken || currentRow.length > 0) {
                currentRow.push(currentToken.trim());
                rows.push(currentRow);
            }

            // Filter empty trailing rows
            const cleanRows = rows.filter(r => r.length > 1 || (r.length === 1 && r[0] !== ''));

            if (cleanRows.length === 0) return { headers: [], data: [] };

            // First row as headers
            const headers = cleanRows[0].map((h, i) => h || `カラム ${i + 1}`);
            const data = cleanRows.slice(1);

            return { headers, data };
        }

            const file = e.target.files[0];
            if (file) {

        function processFile(file) {
            state.fileName = file.name;
            elements.loadedFileName.innerHTML = `<i class="fa-solid fa-file-csv text-primary-500"></i> <span>${file.name} (${formatBytes(file.size)})</span>`;

            const reader = new FileReader();
            reader.onload = function (evt) {
                state.rawCSV = evt.target.result;
                parseAndRenderCSV(state.rawCSV);
                showToast('ファイルが正常に読み込まれました', 'success');
            };
            reader.onerror = function () {
                showToast('ファイルの読み込みに失敗しました', 'error');
            };
            reader.readAsText(file);
        }

        /**
         * Parse Raw String & Trigger Visual Rendering
         */
        function parseAndRenderCSV(rawText) {
            const parsed = parseCSV(rawText, state.delimiter);
            state.headers = parsed.headers;
            state.data = parsed.data;
            state.hiddenColumns.clear();
            state.sortColumn = null;
            state.columnFilters = {};
            state.currentPage = 1;

            updateStats();
            renderColumnDropdown();
            renderTableHeader();
            applyFilters();
        }

        /**
         * Update Summary Statistics
         */
        function updateStats() {
            elements.statRows.textContent = state.data.length.toLocaleString();
            elements.statCols.textContent = state.headers.length.toLocaleString();
            elements.statFiltered.textContent = state.filteredData.length.toLocaleString();
            elements.statSize.textContent = formatBytes(new Blob([state.rawCSV]).size);
        }

        /**
         * Render Column Dropdown
         */
        function renderColumnDropdown() {
            elements.columnCheckboxList.innerHTML = '';
            state.headers.forEach((header, index) => {
                const label = document.createElement('label');
                label.className = 'flex items-center gap-2 px-1 py-1 hover:bg-slate-100 dark:hover:bg-slate-700 rounded cursor-pointer select-none';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = !state.hiddenColumns.has(index);
                checkbox.className = 'rounded text-primary-600 focus:ring-primary-500';
                checkbox.addEventListener('change', () => {
                    if (checkbox.checked) {
                        state.hiddenColumns.delete(index);
                    } else {
                        state.hiddenColumns.add(index);
                    }
                    renderTable();
                });

                const span = document.createElement('span');
                span.className = 'truncate text-slate-700 dark:text-slate-300';
                span.textContent = header;

                label.appendChild(checkbox);
                label.appendChild(span);
                elements.columnCheckboxList.appendChild(label);
            });
        }

        /**
         * Render Table Headers & Filter Inputs
         */
        function renderTableHeader() {
            elements.tableHeaderRow.innerHTML = '<th class="p-4 text-center text-slate-400 font-normal w-12 border-b dark:border-slate-700">#</th>';
            elements.tableFilterRow.innerHTML = '<th class="p-2 text-center text-xs text-slate-400 border-b dark:border-slate-700">🔍</th>';

            state.headers.forEach((header, index) => {
                if (state.hiddenColumns.has(index)) return;

                // Column Header
                const th = document.createElement('th');
                th.className = 'p-3.5 font-semibold text-xs text-slate-600 dark:text-slate-300 uppercase tracking-wider cursor-pointer hover:bg-slate-200/50 dark:hover:bg-slate-600/50 transition select-none border-b dark:border-slate-700';
                
                const isSorted = state.sortColumn === index;
                const sortIcon = isSorted 
                    ? (state.sortDirection === 'asc' ? '<i class="fa-solid fa-sort-up text-primary-600 ml-1.5"></i>' : '<i class="fa-solid fa-sort-down text-primary-600 ml-1.5"></i>') 
                    : '<i class="fa-solid fa-sort opacity-30 group-hover:opacity-100 ml-1.5"></i>';

                th.innerHTML = `<div class="flex items-center justify-between group">
                    <span class="truncate">${escapeHTML(header)}</span>
                    ${sortIcon}
                </div>`;

                th.addEventListener('click', () => {
                    if (state.sortColumn === index) {
                        state.sortDirection = state.sortDirection === 'asc' ? 'desc' : 'asc';
                    } else {
                        state.sortColumn = index;
                        state.sortDirection = 'asc';
                    }
                    applySorting();
                });

                elements.tableHeaderRow.appendChild(th);

                // Column Search Filter Cell
                const filterTh = document.createElement('th');
                filterTh.className = 'p-2 border-b dark:border-slate-700';
                
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = `絞り込み...`;
                input.value = state.columnFilters[index] || '';
                input.className = 'w-full px-2 py-1 text-xs bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded focus:outline-none focus:ring-1 focus:ring-primary-500 font-normal';
                
                input.addEventListener('input', (e) => {
                    state.columnFilters[index] = e.target.value.toLowerCase();
                    applyFilters();
                });

                filterTh.appendChild(input);
                elements.tableFilterRow.appendChild(filterTh);
            });
        }

        /**
         * Filtering Logic
         */
        function applyFilters() {
            const query = state.globalSearch.toLowerCase().trim();

            state.filteredData = state.data.filter(row => {
                // 1. Global Search Filter
                if (query) {
                    const matchesGlobal = row.some(cell => String(cell).toLowerCase().includes(query));
                    if (!matchesGlobal) return false;
                }

                // 2. Column Specific Filters
                for (const [colIdx, filterVal] of Object.entries(state.columnFilters)) {
                    if (filterVal) {
                        const cellVal = String(row[colIdx] || '').toLowerCase();
                        if (!cellVal.includes(filterVal)) return false;
                    }
                }

                return true;
            });

            state.currentPage = 1;
            applySorting();
        }

        /**
         * Sorting Logic
         */
        function applySorting() {
            if (state.sortColumn !== null) {
                const col = state.sortColumn;
                const dir = state.sortDirection === 'asc' ? 1 : -1;

                state.filteredData.sort((a, b) => {
                    let valA = a[col] || '';
                    let valB = b[col] || '';

                    // Numerical Sort fallback
                    const numA = parseFloat(valA.replace(/[^0-9.-]+/g, ""));
                    const numB = parseFloat(valB.replace(/[^0-9.-]+/g, ""));

                    if (!isNaN(numA) && !isNaN(numB) && String(numA) === valA.trim() && String(numB) === valB.trim()) {
                        return (numA - numB) * dir;
                    }

                    return valA.localeCompare(valB, 'ja', { numeric: true }) * dir;
                });
            }

            renderTableHeader();
            renderTableBody();
            updateStats();
        }

        /**
         * Render Main Table Body with Pagination
         */
        function renderTableBody() {
            elements.tableBody.innerHTML = '';

            if (state.filteredData.length === 0) {
                elements.tableBody.innerHTML = `
                    <tr>
                        <td colspan="100%" class="py-12 text-center text-slate-400">
                            <i class="fa-solid fa-magnifying-glass text-3xl mb-2 block opacity-40"></i>
                            該当するデータが見つかりませんでした
                        </td>
                    </tr>`;
                updatePaginationControls(0, 0, 0);
                return;
            }

            const totalRows = state.filteredData.length;
            const pageSize = state.pageSize === 'all' ? totalRows : state.pageSize;
            const startIdx = (state.currentPage - 1) * pageSize;
            const endIdx = Math.min(startIdx + pageSize, totalRows);

            const visibleRows = state.filteredData.slice(startIdx, endIdx);

            visibleRows.forEach((row, rowIdx) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 dark:hover:bg-slate-700/40 transition-colors';

                // Row Number Cell
                const rowNumTd = document.createElement('td');
                rowNumTd.className = 'p-3 text-center text-xs text-slate-400 font-mono select-none border-b dark:border-slate-700/50';
                rowNumTd.textContent = startIdx + rowIdx + 1;
                tr.appendChild(rowNumTd);

                row.forEach((cellValue, colIdx) => {
                    if (state.hiddenColumns.has(colIdx)) return;

                    const td = document.createElement('td');
                    td.className = 'p-3 border-b dark:border-slate-700/50 text-sm break-words max-w-xs';
                    
                    // Highlight Matched Query Text
                    td.innerHTML = highlightText(escapeHTML(cellValue || ''), state.globalSearch);
                    tr.appendChild(td);
                });

                elements.tableBody.appendChild(tr);
            });

            updatePaginationControls(startIdx + 1, endIdx, totalRows);
        }

        /**
         * Pagination UI Controls Updater
         */
        function updatePaginationControls(start, end, total) {
            elements.pageInfoText.textContent = total > 0 
                ? `${total.toLocaleString()} 件中 ${start.toLocaleString()} - ${end.toLocaleString()} 件を表示`
                : '0 件を表示';

            const maxPage = getMaxPage();
            elements.currentPageIndicator.textContent = `ページ ${state.currentPage} / ${maxPage || 1}`;

            elements.firstPageBtn.disabled = state.currentPage <= 1;
            elements.prevPageBtn.disabled = state.currentPage <= 1;
            elements.nextPageBtn.disabled = state.currentPage >= maxPage;
            elements.lastPageBtn.disabled = state.currentPage >= maxPage;
        }

        function getMaxPage() {
            if (state.pageSize === 'all') return 1;
            return Math.ceil(state.filteredData.length / state.pageSize) || 1;
        }

        /**
         * Utility Functions
         */
        function renderTable() {
            renderTableHeader();
            renderTableBody();
        }

        function highlightText(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${escapeRegExp(query)})`, 'gi');
            return text.replace(regex, '<mark class="highlight-match">$1</mark>');
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function escapeHTML(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-800';
            
            toast.className = `${bgClass} text-white text-sm px-4 py-3 rounded-xl shadow-lg pointer-events-auto flex items-center gap-2 animate-bounce transition-all duration-300`;
            toast.innerHTML = `
                <i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-circle-info'}"></i>
                <span>${message}</span>
            `;

            elements.toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        /**
         * Copy Data to Clipboard
         */
        function copyTableToClipboard() {
            if (state.filteredData.length === 0) {
                showToast('コピーするデータがありません', 'error');
                return;
            }

            const visibleHeaderIndices = state.headers
                .map((_, idx) => idx)
                .filter(idx => !state.hiddenColumns.has(idx));

            const headerRow = visibleHeaderIndices.map(idx => state.headers[idx]).join('\t');
            const dataRows = state.filteredData.map(row => 
                visibleHeaderIndices.map(idx => row[idx] || '').join('\t')
            ).join('\n');

            const fullText = `${headerRow}\n${dataRows}`;

            const textarea = document.createElement('textarea');
            textarea.value = fullText;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();

            try {
                document.execCommand('copy');
                showToast('テーブルデータをクリップボードにコピーしました', 'success');
            } catch (err) {
                showToast('コピーに失敗しました', 'error');
            } finally {
                document.body.removeChild(textarea);
            }
        }

        /**
         * Export Filtered Data to CSV
         */
        function exportFilteredCSV() {
            if (state.filteredData.length === 0) {
                showToast('書き出すデータがありません', 'error');
                return;
            }

            const visibleHeaderIndices = state.headers
                .map((_, idx) => idx)
                .filter(idx => !state.hiddenColumns.has(idx));

            const formatCell = (val) => {
                const str = String(val || '');
                if (str.includes(',') || str.includes('"') || str.includes('\n')) {
                    return `"${str.replace(/"/g, '""')}"`;
                }
                return str;
            };

            const headerRow = visibleHeaderIndices.map(idx => formatCell(state.headers[idx])).join(',');
            const dataRows = state.filteredData.map(row => 
                visibleHeaderIndices.map(idx => formatCell(row[idx])).join(',')
            ).join('\r\n');

            const csvContent = "\uFEFF" + `${headerRow}\r\n${dataRows}`; // UTF-8 BOM
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', `exported_${state.fileName || 'data.csv'}`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            showToast('CSVファイルを書き出しました', 'success');
        }

        // Initialize application on page load
        window.onload = initApp;
    </script>
